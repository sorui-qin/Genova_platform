x-service-logging: &service-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-genova}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-genova}
  REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0
  DATA_ROOT: /app/data
  DATA_RETENTION_ENABLED: ${DATA_RETENTION_ENABLED:-false}
  ECLOUDGEN_FULL_TARGET: ${ECLOUDGEN_FULL_TARGET:-true}
  USER_STORAGE_QUOTA_MB: ${USER_STORAGE_QUOTA_MB:-5120}
  GUEST_STORAGE_QUOTA_MB: ${GUEST_STORAGE_QUOTA_MB:-500}
  JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
  BACKEND_ENV: production
  KNOWLEDGE_BACKEND: postgres
  AGENT_REQUEST_OUTPUT_TOKENS: ${AGENT_REQUEST_OUTPUT_TOKENS:-8192}
  AGENT_TURN_OUTPUT_TOKENS: ${AGENT_TURN_OUTPUT_TOKENS:-32768}
  AGENT_TURN_REQUESTS: ${AGENT_TURN_REQUESTS:-16}
  AGENT_TURN_TOOLS: ${AGENT_TURN_TOOLS:-24}
  AGENT_TURN_SECONDS: ${AGENT_TURN_SECONDS:-240}
  AGENT_TURN_LEASE_SECONDS: ${AGENT_TURN_LEASE_SECONDS:-300}
  AGENT_CONTEXT_TARGET_TOKENS: ${AGENT_CONTEXT_TARGET_TOKENS:-98304}
  AGENT_CONTEXT_MAX_INPUT_TOKENS: ${AGENT_CONTEXT_MAX_INPUT_TOKENS:-131072}
  AGENT_CONTEXT_BYTES: ${AGENT_CONTEXT_BYTES:-2097152}

services:
  postgres:
    logging: *service-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-genova}
      POSTGRES_USER: ${POSTGRES_USER:-genova}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    logging: *service-logging
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: [redis-server, --save, '', --appendonly, 'yes', --appendfsync, always, --requirepass, '${REDIS_PASSWORD:?Set REDIS_PASSWORD}']
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend-api:
    logging: *service-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ${IMAGE_REPOSITORY:-genova}:backend-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    environment:
      <<: *backend-env
      AGENT_PROXY_ALLOWED_URLS: ${AGENT_PROXY_ALLOWED_URLS:-}
      AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-1}
      # No public API port; Nginx replaces X-Forwarded-For at the ingress.
      FORWARDED_ALLOW_IPS: '*'
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      UPLOAD_FILE_MAX_MB: ${UPLOAD_FILE_MAX_MB:-500}
    volumes:
      - data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    restart: unless-stopped

  backend-worker:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:backend-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    environment:
      <<: *backend-env
      AUTO_CREATE_TABLES: '0'
    volumes:
      - data:/app/data
    command: [python, -m, backend.worker]
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  workflow-worker:
    logging: *service-logging
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: ${IMAGE_REPOSITORY:-genova}:backend-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    environment:
      <<: *backend-env
      AGENT_PROXY_ALLOWED_URLS: ${AGENT_PROXY_ALLOWED_URLS:-}
      AUTO_CREATE_TABLES: '0'
      WORKFLOW_POLL_SECONDS: ${WORKFLOW_POLL_SECONDS:-1}
    volumes:
      - data:/app/data
    command: [python, -m, backend.workflow_worker]
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  dispatcher:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:backend-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    command: [python, -m, genova_runtime.queue_dispatcher, --redis_url, 'redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0']
    volumes:
      - data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-protein-preparation:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:protein-preparation-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    environment:
      OPENMM_CPU_THREADS: ${OPENMM_CPU_THREADS:-8}
    volumes:
      - data:/app/data
    command: [python, -m, genova_runtime.queue_worker, --task, protein_preparation, --redis_url, 'redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0']
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-surfgen:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:surfgen-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${SURFGEN_CUDA_VISIBLE_DEVICES:-0}
      GPU_LOCK_PATH: /app/data/.locks/gpu-0.lock
    volumes:
      - data:/app/data
    command: [/opt/conda/envs/surfgen/bin/python, -m, genova_runtime.queue_worker, --task, surfgen, --redis_url, 'redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0']
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-ecloudgen:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:ecloudgen-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${SURFGEN_CUDA_VISIBLE_DEVICES:-0}
      GPU_LOCK_PATH: /app/data/.locks/gpu-0.lock
    volumes:
      - data:/app/data
    command: [python, -m, genova_runtime.queue_worker, --task, ecloudgen, --redis_url, 'redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0']
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-epso:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:epso-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${SURFGEN_CUDA_VISIBLE_DEVICES:-0}
      GPU_LOCK_PATH: /app/data/.locks/gpu-0.lock
    volumes:
      - data:/app/data
    command: [python, -m, genova_runtime.queue_worker, --task, epso, --redis_url, 'redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0']
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-delete:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:delete-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${DELETE_CUDA_VISIBLE_DEVICES:-0}
      GPU_LOCK_PATH: /app/data/.locks/gpu-0.lock
    volumes:
      - data:/app/data
    command: [python3, -m, genova_runtime.queue_worker, --task, delete, --redis_url, 'redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0']
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker-tarpass:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:tarpass-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${SURFGEN_CUDA_VISIBLE_DEVICES:-0}
      GPU_LOCK_PATH: /app/data/.locks/gpu-0.lock
      TARPASS_CPUS: ${TARPASS_CPUS:-8}
      TARPASS_BATCH_SIZE: ${TARPASS_BATCH_SIZE:-64}
    volumes:
      - data:/app/data
    command: [python, -m, genova_runtime.queue_worker, --task, tarpass, --redis_url, 'redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD}@redis:6379/0']
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    logging: *service-logging
    image: ${IMAGE_REPOSITORY:-genova}:frontend-${PLATFORM_VERSION:?Set PLATFORM_VERSION}
    ports:
      - '${WEB_PORT:-18001}:80'
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  data:
