map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

log_format genova '$remote_addr - $remote_user [$time_local] '
                  '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    root /usr/share/nginx/html;
    absolute_redirect off;
    access_log /var/log/nginx/access.log genova;
    # The backend spools a whole multipart body before checking per-file and quota limits; cap it here.
    client_max_body_size 1g;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css image/svg+xml application/json application/wasm;

    location = / {
        return 302 /genova/;
    }
    location = /genova {
        return 302 /genova/;
    }
    location /genova/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /genova/index.html;
    }
    location /genova/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~ ^/(?:genova/)?(api|ws)(/.*)?$ {
        gzip off;
        rewrite ^/genova/(.*)$ /$1 break;
        proxy_pass http://backend-api:18000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Behind another proxy (e.g. for HTTPS), add
        # "set_real_ip_from <that proxy's address>; real_ip_header X-Forwarded-For;" to this server
        # block, or every user shares the proxy's address and its limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
